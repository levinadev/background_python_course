# Настоящая модель в Ollama вместо учебной
#   docker compose -f compose.yaml -f compose.ollama.yaml up -d --build
#   docker compose -f compose.yaml -f compose.ollama.yaml exec ollama ollama pull qwen3:0.6b
services:
  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama-models:/root/.ollama

  worker-ai:
    environment:
      AI_BACKEND: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:0.6b
    depends_on:
      ollama:
        condition: service_started

volumes:
  ollama-models:
